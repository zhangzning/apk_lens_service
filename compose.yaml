x-security: &security
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 15s
  restart: unless-stopped
  logging:
    driver: local
  # Docker Engine's default seccomp profile applies to both image targets.

x-worker: &worker
  <<: *security
  image: "${APK_LENS_WORKER_IMAGE:-apk-lens-service:worker}"
  pull_policy: never
  network_mode: none
  cpus: "${APK_LENS_WORKER_CPUS:-2.0}"
  mem_limit: "${APK_LENS_WORKER_MEMORY:-4g}"
  memswap_limit: "${APK_LENS_WORKER_MEMORY:-4g}"
  pids_limit: ${APK_LENS_WORKER_PIDS:-192}
  tmpfs:
    - "/work:rw,nosuid,nodev,noexec,size=${APK_LENS_WORKER_TMPFS:-2g},uid=10001,gid=10001,mode=0700"
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - |
        import os, httpx
        transport = httpx.HTTPTransport(uds=os.environ["APK_LENS_SERVICE_LISTEN_SOCKET"])
        with httpx.Client(transport=transport, timeout=2, trust_env=False) as client:
            client.get("http://localhost/readyz").raise_for_status()
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 20s
  environment:
    APK_LENS_SERVICE_LISTEN_SOCKET: /run/apk-lens/worker.sock
    APK_LENS_SERVICE_WORK_DIR: /work
    APK_LENS_SERVICE_MAX_JOBS: "1"
    APK_LENS_SERVICE_JADX_MAX_HEAP_MB: "${APK_LENS_WORKER_JADX_HEAP_MIB:-1536}"
    APK_LENS_SERVICE_WORKER_CPU_SECONDS: "${APK_LENS_WORKER_CPU_SECONDS:-900}"
    APK_LENS_SERVICE_WORKER_MAX_FILE_MIB: "${APK_LENS_WORKER_MAX_FILE_MIB:-256}"
    APK_LENS_SERVICE_WORKER_ADDRESS_SPACE_MIB: "${APK_LENS_WORKER_ADDRESS_SPACE_MIB:-8192}"

services:
  api:
    <<: *security
    build:
      context: .
      target: api
    image: "${APK_LENS_API_IMAGE:-apk-lens-service:api}"
    pull_policy: never
    cpus: "1.0"
    mem_limit: "384m"
    memswap_limit: "384m"
    pids_limit: 64
    ports:
      - "${APK_LENS_BIND_ADDRESS:-127.0.0.1}:${APK_LENS_PORT:-18086}:18086"
    tmpfs:
      - "/tmp:rw,nosuid,nodev,noexec,size=16m,uid=10001,gid=10001,mode=0700"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import httpx; httpx.get("http://127.0.0.1:18086/readyz", timeout=3, trust_env=False).raise_for_status()
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      APK_LENS_SERVICE_HOST: 0.0.0.0
      APK_LENS_SERVICE_TOKEN: "${APK_LENS_SERVICE_TOKEN:?Set APK_LENS_SERVICE_TOKEN}"
      APK_LENS_SERVICE_WORKER_SOCKETS: '["/run/apk-lens/worker-1/worker.sock","/run/apk-lens/worker-2/worker.sock"]'
      APK_LENS_SERVICE_JOBS_DIR: /var/lib/apk-lens/jobs
      APK_LENS_SERVICE_JOB_TTL_SECONDS: "${APK_LENS_JOB_TTL_SECONDS:-900}"
      APK_LENS_SERVICE_JOBS_STORAGE_MIB: "${APK_LENS_JOBS_STORAGE_MIB:-2048}"
    volumes:
      - worker-1-socket:/run/apk-lens/worker-1:ro
      - worker-2-socket:/run/apk-lens/worker-2:ro
      - api-jobs:/var/lib/apk-lens/jobs
  worker-1:
    <<: *worker
    build:
      context: .
      target: worker
    volumes:
      - worker-1-socket:/run/apk-lens:rw
  worker-2:
    <<: *worker
    volumes:
      - worker-2-socket:/run/apk-lens:rw

volumes:
  api-jobs:
  worker-1-socket:
    driver: local
    driver_opts: &socket_tmpfs
      type: tmpfs
      device: tmpfs
      o: size=1m,nosuid,nodev,noexec,uid=10001,gid=10001,mode=0700
  worker-2-socket:
    driver: local
    driver_opts: *socket_tmpfs
