[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apk_lens_service"
version = "1.0.0"
description = "Standalone static APK analysis with process-isolated jobs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "androguard==4.1.3",
    "apkinspector==1.3.7",
    "anyio==4.14.2",
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "javalang==0.13.0",
    "loguru==0.7.3",
    "mutf8==1.1.0",
    "Pillow==12.3.0",
    "prometheus-client==0.26.0",
    "pydantic==2.11.4",
    "pydantic-settings==2.9.1",
    "uvicorn==0.34.2",
]

[project.scripts]
apk-lens-service = "apk_lens_service.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools]
packages = ["apk_lens_service"]

[tool.setuptools.package-data]
apk_lens_service = ["android_permissions.json", "aosp_permission_definitions.json", "packer_signatures.json"]
