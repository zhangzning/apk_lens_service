name: Tests

"on":
  push:
    branches: [main, "11201507"]
  pull_request:
    branches: [main, "11201507"]

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.8
      - name: Python tests
        run: uv run --locked pytest -q
      - name: Linux Compose regression
        run: python tests/compose_integration.py
      - name: Build deployment bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/package-compose.sh
      - name: Upload deployment bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-lens-service-linux-amd64
          path: dist/apk-lens-service-*-linux-amd64.tar.gz
          if-no-files-found: error
          compression-level: 0
